<html>
    <head>
        <title>Drone2D</title>
        <style>
            .flex-container{
                display: flex;
                justify-content: space-evenly;
                flex-direction: column;
            }
        </style>
    </head>
    <body styls="width:100%;height:100%;margin:0">
        <canvas id="fpv" style="width:100%;height:100%;position:absolute;left:0;top:0"></canvas>
        <div id="flex-container">
            <h1 id="pos">Pos</h1>
            <h1 id="vel">Vel</h1>
            <h1 id="rot">Rot</h1>
            <h1 id="rotV">RotV</h1>
            <h1 id="wind">Wind</h1>
            <h1 id="cont">Control</h1>
        </div>
        <div class="flex-container" style="position:absolute;right: 0;top: 0;">
            <label for="tpx">Target px:</label><input id="tpx" value="0">
            <label for="tpy">Target py:</label><input id="tpy" value="0">
            <label for="tvx">Target vx:</label><input id="tvx" value="0">
            <label for="tvy">Target vy:</label><input id="tvy" value="0">
            <label for="ta">Target a:</label><input id="ta" value="0">
            <label for="tw">Target w:</label><input id="tw" value="0">
            <button id="updateTarget">Update</button>
        </div>
        <div class="flex-container" style="position:absolute;left:0;bottom:0">
            <input  id="droneSelect" type="range" min="0">
            <button id="resetDrone">Reset Drone</button>
        </div>
        <script src="./drone.js"></script>
        <script src="./main.js"></script>
        <script src="./drone_lqr_0.js"></script>
    </body>
</html>
